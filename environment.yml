name: narrative_clean
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip
  - numpy
  - pandas
  - scikit-learn
  - pyarrow      # conda-forge binary; avoids many DLL issues
  - matplotlib
  - pillow
  - spacy
  - nltk
  - joblib
  - ipykernel
  - jinja2
  - tqdm
  - pip-tools
  - wordcloud
  - plotly
  - kaleido
  - sentence-transformers
  - transformers
  - sentencepiece
  - huggingface-hub
  - pip:
      - streamlit==1.49.1
      - streamlit-option-menu==0.4.0
      - streamlit_chat  # optional if you use it
      - tokenizers
      - torchvision
